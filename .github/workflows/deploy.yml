name: Deploy to Vercel

# Deploys to Vercel on every push to main, and on demand from the Actions tab
# (Run workflow), where the target can be set to preview instead.
#
# Without a VERCEL_TOKEN secret a push is skipped with a warning rather than
# failed, so main does not go red before the secret is configured; a manual run
# fails loudly instead, since asking for a deploy without a token is a mistake.
#
# Required repository secret:
#   VERCEL_TOKEN                 Vercel → Account Settings → Tokens
# Optional secrets (passed to the deployment as environment variables):
#   VERCEL_SCOPE                 team slug, only if the project should live in a team
#   VERCEL_ORG_ID                Vercel team/user id; set it with VERCEL_PROJECT_ID to skip linking
#   VERCEL_PROJECT_ID            Vercel project id (defaults to the existing ruhh project below)
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
#   NEXT_PUBLIC_SITE_URL, ADMIN_EMAILS, CRON_SECRET
#   RESEND_API_KEY, EMAIL_FROM, ORDER_ALERT_EMAIL
#   WHATSAPP_ACCESS_TOKEN, WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_VERIFY_TOKEN, WHATSAPP_APP_SECRET,
#   WHATSAPP_ORDER_TEMPLATE, WHATSAPP_STATUS_TEMPLATE, WHATSAPP_OWNER_ALERT_NUMBER

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "production or preview"
        default: production
        required: true

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
      # Org and project ids are identifiers, not credentials, so they are
      # defaulted here; secrets override them. The CLI needs BOTH or it refuses
      # to target a project, so never set one without the other.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_lRYOZi2Tzw8gn1uHtd0tSC2E' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_8yrXBWT34sp1WQMxz83O4cx2Ptnv' }}
      VERCEL_PROJECT: ruhh
    steps:
      - uses: actions/checkout@v4

      - name: Check for the Vercel token
        id: token
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_token=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "::error title=Missing VERCEL_TOKEN::Create a token at https://vercel.com/account/tokens and add it as a repository secret named VERCEL_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "::warning title=Missing VERCEL_TOKEN::Deploy skipped for this push. Add a repository secret named VERCEL_TOKEN (Settings → Secrets and variables → Actions) and pushes to main will deploy on their own."
          echo "### Deploy skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No VERCEL_TOKEN secret is set, so there was nothing to deploy with." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: steps.token.outputs.has_token == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.token.outputs.has_token == 'true'

      - name: Lint, typecheck, test
        if: steps.token.outputs.has_token == 'true'
        run: npm run check

      - name: Identify the Vercel account
        if: steps.token.outputs.has_token == 'true'
        run: |
          SCOPE_ARG=""
          if [ -n "$VERCEL_SCOPE" ]; then SCOPE_ARG="--scope $VERCEL_SCOPE"; fi
          if npx --yes vercel@59 whoami --token "$VERCEL_TOKEN" $SCOPE_ARG; then
            echo "Token authenticated."
          else
            echo "::error title=Vercel token rejected::VERCEL_TOKEN did not authenticate ('User not found' means the token is invalid, expired, or belongs to an account the CLI cannot resolve without a scope). Issue a fresh token at https://vercel.com/account/tokens for the account or team that owns the project, update the VERCEL_TOKEN secret, and set VERCEL_ORG_ID (and VERCEL_SCOPE for a team) so the deploy does not depend on name lookup."
            exit 1
          fi

      - name: Link the Vercel project (creates it on first run)
        if: steps.token.outputs.has_token == 'true'
        run: |
          if [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            echo "Deploying into project $VERCEL_PROJECT_ID via VERCEL_ORG_ID; no link step needed."
            exit 0
          fi
          echo "::warning title=VERCEL_ORG_ID not set::Linking by the project name \"$VERCEL_PROJECT\", which CREATES a new project when no project of that name exists. Set VERCEL_ORG_ID (with VERCEL_PROJECT_ID) to deploy into a specific existing project instead."
          SCOPE_ARG=""
          if [ -n "$VERCEL_SCOPE" ]; then SCOPE_ARG="--scope $VERCEL_SCOPE"; fi
          npx --yes vercel@59 link --yes --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN" $SCOPE_ARG

      - name: Deploy
        if: steps.token.outputs.has_token == 'true'
        id: deploy
        env:
          TARGET: ${{ github.event.inputs.target || 'production' }}
          S_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          S_NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          S_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          S_NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          S_ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          S_CRON_SECRET: ${{ secrets.CRON_SECRET }}
          S_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          S_EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          S_ORDER_ALERT_EMAIL: ${{ secrets.ORDER_ALERT_EMAIL }}
          S_WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          S_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          S_WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          S_WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          S_WHATSAPP_ORDER_TEMPLATE: ${{ secrets.WHATSAPP_ORDER_TEMPLATE }}
          S_WHATSAPP_STATUS_TEMPLATE: ${{ secrets.WHATSAPP_STATUS_TEMPLATE }}
          S_WHATSAPP_OWNER_ALERT_NUMBER: ${{ secrets.WHATSAPP_OWNER_ALERT_NUMBER }}
        run: |
          set -euo pipefail
          ARGS=()
          missing=()
          # Every configured secret becomes both a build-time and a runtime variable.
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SITE_URL ADMIN_EMAILS CRON_SECRET RESEND_API_KEY EMAIL_FROM ORDER_ALERT_EMAIL WHATSAPP_ACCESS_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_VERIFY_TOKEN WHATSAPP_APP_SECRET WHATSAPP_ORDER_TEMPLATE WHATSAPP_STATUS_TEMPLATE WHATSAPP_OWNER_ALERT_NUMBER; do
            var="S_$name"; val="${!var:-}"
            if [ -n "$val" ]; then ARGS+=(-e "$name=$val" -b "$name=$val"); else missing+=("$name"); fi
          done
          if [ -z "${S_NEXT_PUBLIC_SITE_URL:-}" ]; then
            ARGS+=(-e "NEXT_PUBLIC_SITE_URL=https://$VERCEL_PROJECT.vercel.app" -b "NEXT_PUBLIC_SITE_URL=https://$VERCEL_PROJECT.vercel.app")
          fi
          if [ "$TARGET" = "production" ]; then ARGS+=(--prod); fi
          SCOPE_ARG=(); if [ -n "$VERCEL_SCOPE" ]; then SCOPE_ARG=(--scope "$VERCEL_SCOPE"); fi

          URL=$(npx --yes vercel@59 deploy --yes --token "$VERCEL_TOKEN" "${SCOPE_ARG[@]}" "${ARGS[@]}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed ($TARGET)"
            echo
            echo "$URL"
            echo
            if [ ${#missing[@]} -gt 0 ]; then
              echo "Secrets not set (skipped): ${missing[*]}"
              echo
              echo "Without the Supabase secrets the storefront shows an empty menu and the admin shows a configuration notice."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        if: steps.token.outputs.has_token == 'true'
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          fail=0
          for path in / /menu /api/health /manifest.webmanifest; do
            out=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" "$URL$path")
            code=${out%% *}
            location=${out#* }
            echo "$path → $code${location:+ → $location}"
            case "$code" in
              200|401)
                ;;
              3??)
                echo "::error::$path returned $code redirecting to ${location:-an unknown location}. A redirect to vercel.com or an authentication page means Deployment Protection is enabled for this project (Vercel → Project → Settings → Deployment Protection); the site is not publicly reachable until it is turned off."
                fail=1
                ;;
              *)
                echo "::error::$path returned $code"
                fail=1
                ;;
            esac
          done
          exit "$fail"
